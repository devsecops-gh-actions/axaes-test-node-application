# Caller de integración continua de axaes-template-node-application (generado por devsecops-scaffold).
# Check requerido: "CI / build-and-test" (PLAN.md 2.1): job "CI" que llama a ci-<stack>.yml (job build-and-test).
# Los reutilizables viven en devsecops-gh-actions/shared-workflows/.github/workflows/ (PLAN 2.1, 2.6).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo común; cada job declara lo suyo.
permissions:
  contents: read

jobs:
  CI:
    uses: devsecops-gh-actions/shared-workflows/.github/workflows/ci-node.yml@1fac042b77217a956a73759e8d090c819560b0ea
    with:
      kind: application
      run-tests: true
      publish: false
    permissions:
      contents: read



