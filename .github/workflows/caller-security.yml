# Caller de seguridad de código de axaes-template-node-application (stack node, soportado por CodeQL).
# Checks requeridos (PLAN.md 2.1): "Security / codeql", "Security / dependency-review", "Security / secret-scan".
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: devsecops-gh-actions/shared-workflows/.github/workflows/security.yml@bb94195f0e8e0b60bc5420d676dfacdb528427ae
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    with:
      codeql-languages: "javascript-typescript"
      dependency-fail-on-severity: high
      require-push-protection: true
